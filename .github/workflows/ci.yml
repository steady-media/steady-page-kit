# CI: Syntax-Check + Tests bei jedem Push/PR. Deploys laufen weiterhin
# bewusst manuell über `npm run deploy` (wrangler).
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
